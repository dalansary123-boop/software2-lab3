{% load static %}
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عن المتجر 🌸 | Blossom Boutique</title>
    <!-- استيراد خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
   
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fff5f7;
            color: #4a4a4a;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .about-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
            border: 2px solid #ffeef2;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .about-card h1 {
            color: #ff6b8b;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .about-card p {
            line-height: 1.8;
            color: #6a4c56;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        .btn-back {
            display: inline-block;
            background: linear-gradient(135deg, #ff8da1, #ff6b8b);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background: linear-gradient(135deg, #ff6b8b, #e05272);
        }
    </style>
</head>
<body>

    <div class="about-card">
        <h1>🌸 Blossom Boutique 🌸</h1>
        <p>
            مرحباً بكِ في متجر الكياتة! نحن متجر متخصص في تقديم أرقى منتجات العناية، للهدايا، الأدوات المدرسية والشموع المعطرة بتصاميم وألوان تضفي لمسة من السعادة على يومكِ.
        </p>
        <!-- رابط العودة للصفحة الرئيسية باستخدام الـ namespace -->
        <a href="{% url 'students:home' %}" class="btn-back">العودة للمتجر 🛍️</a>
    </div>

</body>
</html>
