{% extends 'shop/base.html' %}
{% load static %}

{% block title %}الملف الشخصي | روائح الذهب{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="page-title">👤 الملف الشخصي</h1>
        
        <div class="auth-container">
            <div class="auth-card">
                <h2>معلوماتي</h2>
                
                <form method="post" class="auth-form">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label>اسم المستخدم:</label>
                        <input type="text" value="{{ user.username }}" class="form-control" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label>البريد الإلكتروني:</label>
                        <input type="email" value="{{ user.email }}" class="form-control" disabled>
                    </div>
                    
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="field-error">{{ field.errors|join:", " }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-primary btn-large btn-block">حفظ التغييرات</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
